# bbhost PC port options. Written by the options screen (F10).
[options]
version = "5"
window_mode = "Windowed"
vsync = "On"
frame_cap = "Display-Limited"
frame_clock = "Off"
fps_counter = "On"
memory_counter = "Off"
perf_overlay = "Off"
fov = "+0%"
camera_distance = "5"
camera_height = "5"
camera_tuning = "Original"
mouse_menu = "On"
mouse_camera = "On"
mouse_sens = "5"
mouse_invert_x = "Off"
mouse_invert_y = "Off"
mouse_auto_rotation = "Off"
draw_cursor = "On"
button_prompts = "Auto"
ssao = "On"
motion_blur = "On"
anti_alias = "On"
depth_of_field = "On"
chromatic_aberration = "On"
bloom = "10"
vignette = "On"
shadow_distance = "x1.0"
ao_strength = "5"
saturation = "5"
fog = "10"
model_detail = "Normal"
resolution = "1280x720"
shaders = "HLSL"
skip_logos = "On"
performance_mode = "Off"
debug_menu = "Off"
debug_camera = "Off"
change_appearance = "On"
rebirth = "On"
five_players = "On"
skill_issue = "Off"
menu_text_size = "100%"
menu_hue = "0°"
menu_vibrance = "0%"

[keys]
move_forward = "W"
move_back = "S"
move_left = "A"
move_right = "D"
walk = "Left Alt"
roll = "Space"
lock_on = "Q"
attack = "Mouse1"
strong_attack = "V"
strong_modifier = "Left Shift"
transform = "C"
firearm = "X, Mouse2"
blood_vial = "R"
use_item = "F"
interact = "E"
switch_item = "Down"
switch_right = "Right"
switch_left = "Left"
dpad_up = "Up"
gestures = "G"
personal_effects = "T"
look_up = "I"
look_down = "K"
look_left = "J"
look_right = "L"
menu = "Escape"
confirm = "Return"
back = "Backspace"
menu_page_left = "PageUp"
menu_page_right = "PageDown"
menu_shortcut_left = "Home"
menu_shortcut_right = "End"
menu_display = "F"
menu_status = "R"
l3 = "Left Ctrl"
zoom_in = "WheelUp"
zoom_out = "WheelDown"
zoom_reset = "Mouse3"
debug_menu = "`"
[account]
name = ""
token = ""
